# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Org defaults: https://github.com/bitwisedesign/coderabbit/blob/main/.coderabbit.yaml
inheritance: true


tone_instructions: "You must talk like a highly skilled Swift SDK engineer fluent in Swift concurrency, actors, and Apple platform library design. This is an open-source iOS + macOS SDK — not an app and not a server."

reviews:
  path_instructions:
    - path: "README.md"
      instructions: |
        Project overview for the XanoRealtime open-source Swift SDK (iOS 16+, macOS 13+). Prefer clarity on purpose, SPM install, platforms, and the public connect/channel/events API. Flag missing or contradictory install, platform, or usage instructions.
        For this repository, CodeRabbit review comments must stay within code-review scope. Do not provide operations guidance, deployment reminders, or other Ops-related advice.
    - path: "docs/**/*.md"
      instructions: |
        Integrator and contributor docs for the Apple Xano Realtime SDK (architecture, protocol, reconnection, lifecycle). Prefer accuracy against the public API and the official Xano JS SDK wire protocol.
        If traversing a URL to a GitHub document results in a 404, do not comment on it. You won't have access to it this way, but the appropriate people on our end will. These 404s are NOT YOUR CONCERN.
    - path: "**/*.swift"
      instructions: |
        This is an open-source iOS + macOS SDK (not an app and not a server). It speaks the Xano Realtime WebSocket protocol via ports/adapters. Review the Swift code and:
        - DO NOT review or comment on DocC documentation, documentation comments, or documentation formatting.
        - DO NOT review or comment on MARK section organization, MARK comments, or MARK section naming conventions.
        - DO NOT suggest UI, localization, accessibility, AppKit/UIKit/SwiftUI, Core Data, CloudKit, or app-lifecycle patterns in domain/library code. Optional iOS UIKit belongs only behind `#if` in `Lifecycle/`.
        - Do NOT require Linux portability. Prefer APIs available on both iOS and macOS; flag or `#if` platform-only APIs.
        - Hexagonal architecture: domain (`Domain/`, `Models/`, `Channel/`, `Client/`, `Reliability/`, `Configuration/`) depends on ports only. Only `Sources/XanoRealtime/Adapters/` may use `URLSession` / `URLSessionWebSocketTask` types. Domain talks to `WebSocketProviding` / `WebSocketTasking`, never to `URLSession`.
        - `WebSocketConnection`, `XanoRealtimeClient`, and `XanoRealtimeChannel` are actors. Prefer structured concurrency (async/await, TaskGroup, actors) over unstructured tasks and ad-hoc locks. Flag data races and shared mutable state.
        - Do not introduce `@unchecked Sendable` or `nonisolated(unsafe)` to bypass isolation.
        - Identify unused or redundant code. Detect variables, functions, or modules that are not being utilized and highlight them for review.
        - Compare against the Swift API design guidelines and Swift style guide; flag mismatches that hurt readability or API clarity.
        - Review for best practices, efficiency, and readability: naming, function design, error handling, and configuration (env vars / config APIs — never hardcode credentials).
        - Flag uncommented `try?` except intentional best-effort teardown/cleanup; prefer `try` so failures propagate.
        - Prefer `nil` over `Type?.none`, named types over tuples for project-owned APIs, computed properties over zero-argument getters, and omit redundant `internal`.
        - Suggest better use of Swift features where it improves clarity (e.g. typed errors, Result, Sendable where relevant).
        - Flag crash-prone paths (force unwraps, unchecked casts, unbounded recursion, resource leaks) and suggest graceful failure with clear error surfaces.
        - Suggest unit tests where coverage is thin, especially around connect/handshake, channel routing, decode errors, reconnect/backoff, heartbeats, and cancellation. Tests inject `MockWebSocketProvider`; do not hit the network in unit tests.
        - Domain awareness: Xano Realtime protocol matters — nested `{ action, options, payload }` envelopes, JWT as `Sec-WebSocket-Protocol`, one socket/many channels, reconnect close codes, and heartbeat/lifecycle behavior when the change touches them.
    - path: "**/Package.swift"
      instructions: |
        Swift Package Manager manifest for the XanoRealtime library (iOS 16+, macOS 13+).
        - Flag platform declarations that drop iOS or macOS, or that add Linux as a required target.
        - Review dependency versions for security and Apple-platform compatibility; prefer pinned/resolvable versions suitable for CI. Do not add Starscream or other WebSocket libraries — transport is `URLSessionWebSocketTask`.
        - Call out products/targets that look unused or mis-scoped for a library SDK (no app or server executables).
    - path: "**/*Tests/**"
      instructions: |
        Best practices for unit tests (minimum bar):
        - Use Swift Testing (`@Test`, `#expect`, `#require`) — not XCTest. Never force-unwrap (`!`, `as!`, `try!`); use `try #require(...)` and mark the test `throws`.
        - Flag timeouts under 2 seconds — they are unstable on CI/CD.
        - Flag tests that use Task.sleep to wait for state changes; prefer modern Swift concurrency test patterns (checked continuations, clocks/fakes). `Task.sleep` is only acceptable when the subject under test requires a real delay.
        - Flag `DispatchQueue.global()` in tests; use a file-private or test-local `DispatchQueue(label:)`.
        - Avoid reviewing mock internals unless the mock itself is clearly wrong for the scenario. Tests inject `MockWebSocketProvider` (same port); do not hit the network.
        - If a test is disabled, assume it is intentional — do not suggest re-enabling it.
        - Tests are not required to have DocC or other documentation.
        - Prefer deterministic fixtures (failed connects, decode errors, dropped messages, idle timeouts, reconnect/backoff) over flaky timing-based checks.
    - path: ".github/workflows/**"
      instructions: |
        This is a public open-source repository. Anyone can open a pull request from a fork, so review GitHub Actions as untrusted-contributor CI — not as private-org automation.
        - Treat every workflow change as potentially attacker-controlled. Prefer pull_request over pull_request_target. Flag pull_request_target, workflow_run, or issue_comment triggers unless the job is metadata-only (labels, comments, triage) and never checks out or executes pull-request / fork code.
        - Flag secrets, write-capable GITHUB_TOKEN scopes, or deployment credentials on jobs that run untrusted PR code. Fork PRs must not receive repository secrets.
        - Require an explicit top-level or job-level permissions block with least privilege (contents: read by default). Flag missing permissions, contents: write, packages: write, or id-token: write unless a trusted, non-fork job clearly needs them.
        - Flag actions/checkout of github.event.pull_request.head.sha (or other PR/fork refs) in privileged workflows, persist-credentials: true on untrusted checkouts, and allow-unsafe-pr-checkout.
        - Flag script injection from untrusted context (PR title, body, branch name, commit message, review comments) interpolated into run: shells or other interpreters.
        - Prefer pinning third-party actions to a full commit SHA. Flag newly introduced unpinned third-party actions, tags that float (e.g. @v1 without a SHA), and actions from unknown publishers.
        - Flag secret leakage in logs, overly broad cache restore-keys that could be poisoned by a fork PR, and uploading or downloading artifacts across a trust boundary without treating the contents as untrusted.
        - Do not suggest adding secrets, privileged tokens, or private-repo-only patterns to make fork CI more convenient.
  pre_merge_checks:
    docstrings:
      mode: "warning"
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
chat:
  allow_non_org_members: false
knowledge_base:
  automatic_repository_linking: true
