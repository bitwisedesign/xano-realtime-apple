name: SwiftLint

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false
      - name: Lint
        uses: cirruslabs/swiftlint-action@37b78e658ba6bcb1679df34819a4a8d8c269a940 # v1.1.0
        with:
          version: "0.65.1"
